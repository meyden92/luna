name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No code-generation step: the Drizzle schema is ordinary TypeScript, so
      # nothing here needs a DATABASE_URL to produce a client (issue #46).
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      # DATABASE_URL is deliberately unset here. The database-backed suites
      # (audit coverage, collation, and the denylist fail-open regression) assert
      # against a *seeded* database, not merely a schema, and CI has no seeded
      # database to point them at. They detect the missing URL and skip
      # themselves rather than failing, so this job still catches everything
      # that does not need a database. Run them locally against the dev
      # Postgres — see docs/db-verification.md.
      #
      # bunfig.toml scopes `bun test` to src/; the Playwright suite runs
      # separately via `bun run test:e2e`.
      - name: Unit tests
        run: bun test

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto (the default) already appends `latest` on tag events,
          # which duplicated the explicit entry below. Disabling it keeps the
          # tag set exactly: the version tag plus latest.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA layer cache: exporting it took ~5x longer than the build
          # itself, and tag builds rarely hit it anyway.
          # Deployment URLs are deliberately absent: they are runtime
          # configuration, so this image stays domain-agnostic.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
