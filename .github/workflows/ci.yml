name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No code-generation step: the Drizzle schema is ordinary TypeScript, so
      # nothing here needs a DATABASE_URL to produce a client (issue #46).
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      # DATABASE_URL is deliberately unset here. The database-backed suites
      # (audit coverage, collation, and the denylist fail-open regression) assert
      # against a *seeded* database, not merely a schema — and the only seed is
      # the production dump, which is gitignored and holds cleartext credentials
      # (issue #27). They detect the missing URL and skip themselves rather than
      # failing, so this job still catches everything that does not need a
      # database. Run them locally against the dev Postgres, or as part of
      # `bun run db:rehearse` — see docs/db-verification.md.
      #
      # bunfig.toml scopes `bun test` to src/; the Playwright suite runs
      # separately via `bun run test:e2e`.
      - name: Unit tests
        run: bun test

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto (the default) already appends `latest` on tag events,
          # which duplicated the explicit entry below. Disabling it keeps the
          # tag set exactly: the version tag plus latest.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Deployment URLs are deliberately absent: they are runtime
          # configuration, so this image stays domain-agnostic.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}

  deploy:
    name: Trigger deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      # The full webhook URL lives in a secret so no deployment identifiers are
      # committed to this public repository. Skipped when the secret is unset.
      - name: Trigger Coolify deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set — skipping deploy."
            exit 0
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            "$DEPLOY_WEBHOOK_URL"
