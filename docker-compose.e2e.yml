# Disposable end-to-end stack (ADR 0006). Started and destroyed by
# `bun run test:e2e` (scripts/e2e/run.ts); not meant to be run by hand.
#
# Unlike docker-compose.dev.yml there is no container_name, no fixed host port
# and no persistent volume: the wrapper runs each stack under a unique project
# name with random ports, and `down -v` removes the named volumes with it. Every
# ${…} below is supplied by the wrapper, which also passes `--env-file /dev/null`
# so Compose never reads the repo's .env.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lunashare
      POSTGRES_PASSWORD: lunashare
      POSTGRES_DB: lunashare
      TZ: UTC
      PGTZ: UTC
    ports:
      # Published for the suite's `db` fixture and the admin bootstrap.
      - "127.0.0.1:${E2E_POSTGRES_PORT:?}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunashare -d lunashare"]
      interval: 2s
      timeout: 5s
      retries: 30

  rustfs:
    # The version dev storage runs.
    image: rustfs/rustfs:1.0.0-rc.2
    environment:
      RUSTFS_ACCESS_KEY: ${E2E_S3_ACCESS_KEY_ID:?}
      RUSTFS_SECRET_KEY: ${E2E_S3_SECRET_ACCESS_KEY:?}
    ports:
      # Loopback only: the bucket allows anonymous reads. The app reaches this
      # port through host.docker.internal, which Docker Desktop forwards to the
      # host's loopback; on Linux it is the bridge gateway and would not reach it.
      - "127.0.0.1:${E2E_S3_PORT:?}:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  fal-fake:
    # Stands in for fal.ai (tests/e2e/stack/fal-fake): the app's three fal hosts
    # point here, and the fake makes no outbound connections.
    build:
      context: tests/e2e/stack/fal-fake
      additional_contexts:
        corpus: tests/e2e/fixtures/files
    image: lunashare-fal-fake:e2e
    environment:
      # Listens on the published port itself, so the URLs it hands out work in
      # the app container (by service name) and in the browser, which maps
      # fal-fake to 127.0.0.1 (see playwright.config.ts).
      PORT: ${E2E_FAL_PORT:?}
      PUBLIC_URL: http://fal-fake:${E2E_FAL_PORT:?}
      FAL_KEY: ${E2E_FAL_KEY:?}
      FAL_BILLING_KEY: ${E2E_FAL_BILLING_KEY:?}
    ports:
      # Published for the specs' control hooks (`/__control/*`).
      - "127.0.0.1:${E2E_FAL_PORT:?}:${E2E_FAL_PORT:?}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${E2E_FAL_PORT:?}/__control/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      args:
        BUILD_COMMIT: ${E2E_BUILD_COMMIT:-unknown}
    image: lunashare:e2e
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      fal-fake:
        condition: service_healthy
    environment:
      BETTER_AUTH_SECRET: ${E2E_BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: http://localhost:${E2E_APP_PORT:?}
      PUBLIC_BASE_URL: http://localhost:${E2E_APP_PORT:?}
      DATABASE_URL: postgresql://lunashare:lunashare@postgres:5432/lunashare
      # The app and the test browser must reach storage by the same host name,
      # because presigned URLs sign the host. The browser maps
      # host.docker.internal to 127.0.0.1 (see playwright.config.ts).
      AWS_ENDPOINT: http://host.docker.internal:${E2E_S3_PORT:?}
      # Path-style addressing: the bucket belongs in CDN_URL, never in AWS_ENDPOINT.
      CDN_URL: http://host.docker.internal:${E2E_S3_PORT:?}/${E2E_S3_BUCKET:?}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${E2E_S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${E2E_S3_SECRET_ACCESS_KEY:?}
      AWS_BUCKET_NAME: ${E2E_S3_BUCKET:?}
      FORM_FIELD_ENCRYPTION_KEY: ${E2E_FORM_FIELD_ENCRYPTION_KEY:?}
      RENDITION_SIGNING_SECRET: ${E2E_RENDITION_SIGNING_SECRET:?}
      DELIVERY_COOKIE_SECRET: ${E2E_DELIVERY_COOKIE_SECRET:?}
      # Above every corpus file, so the ShareX oversize spec needs only a buffer of limit + 1 bytes.
      # Keep in step with SHAREX_MAX_UPLOAD_BYTES in tests/e2e/stack-env.ts.
      MAX_SHAREX_UPLOAD_BYTES: 10485760
      # Per-run dummy keys, valid only at fal-fake: a test run never reaches fal.
      # PUBLIC_BASE_URL is plain http on localhost, which fal could not call
      # back, so webhooks stay off and the poller finishes every Generation.
      FAL_KEY: ${E2E_FAL_KEY:?}
      FAL_BILLING_KEY: ${E2E_FAL_BILLING_KEY:?}
      FAL_QUEUE_BASE_URL: http://fal-fake:${E2E_FAL_PORT:?}
      FAL_REST_BASE_URL: http://fal-fake:${E2E_FAL_PORT:?}
      FAL_API_BASE_URL: http://fal-fake:${E2E_FAL_PORT:?}/v1
      # The suite plays the one reverse proxy in front of the app: each test
      # context sends its own `x-forwarded-for` (tests/e2e/fixtures/users.ts),
      # which is how it gets its own rate-limit bucket.
      TRUSTED_PROXY_HOPS: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${E2E_APP_PORT:?}:3000"

volumes:
  pgdata:
  s3data:
