services:
  app:
    image: ${LUNASHARE_IMAGE:-ghcr.io/meyden92/luna:latest}
    pull_policy: always
    container_name: lunashare-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - PORT=3000
      - HOST=0.0.0.0

      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}

      - DATABASE_URL=${DATABASE_URL}

      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - VITE_PUBLIC_CDN_URL=${VITE_PUBLIC_CDN_URL}
      - VITE_PUBLIC_SERVER_URL=${VITE_PUBLIC_SERVER_URL}

      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - FORM_FIELD_ENCRYPTION_KEY=${FORM_FIELD_ENCRYPTION_KEY:-}
    restart: unless-stopped
    networks:
      - lunashare-network
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/api/health')).ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lunashare-network:
    driver: bridge
