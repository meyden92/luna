services:
  app:
    image: ${LUNASHARE_IMAGE:-ghcr.io/meyden92/luna:latest}
    pull_policy: always
    container_name: lunashare-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - PORT=3000
      - HOST=0.0.0.0

      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}

      - DATABASE_URL=${DATABASE_URL}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Encrypts the Vault; everything else is set under Settings -> Vault (see README).
      - FORM_FIELD_ENCRYPTION_KEY=${FORM_FIELD_ENCRYPTION_KEY}
    restart: unless-stopped
    networks:
      - lunashare-network
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/api/health')).ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lunashare-network:
    driver: bridge
